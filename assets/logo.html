<!doctype html>
<!--
  Logo source: logo-light.png and logo-dark.png are rendered from this file.
  ?theme=dark   dark variant
  ?compact      mark + name only, for the app window's header (M3)
  ?icon         the glyph alone on a transparent background, for the app icon (M7)

  How to export: open this file in a browser, DevTools -> inspect the .logo node ->
  "Capture node screenshot" (context menu). The crop follows the .logo box, so the size fits the
  content and the background stays transparent. Headless equivalent: render at device scale 2 on
  a transparent background and crop to the content plus the .logo padding.
-->
<meta charset="utf-8">
<title>Fibocom FM350-GL Windows GUI — logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  :root {
    --ink: #101418;
    --muted: #5b6570;
    --accent: #0c8f80;
    --accent-2: #33c2ad;
    --mark-ink: #ffffff;
  }
  body.dark {
    --ink: #e9eff6;
    --muted: #8b98a5;
    --accent: #3fd4bf;
    --accent-2: #86ead9;
    --mark-ink: #0b1017;
  }
  html, body { margin: 0; background: transparent; }
  body { display: flex; align-items: flex-start; }

  .logo {
    display: flex; align-items: center; gap: 34px;
    padding: 30px 34px;
    font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* The mark: signal bars (the modem's link) inside a circular arrow (the link being kept up).
     The last bar is dimmed, like a signal indicator one step short of full. */
  .mark {
    width: 104px; height: 104px; border-radius: 26px; flex: none;
    background: linear-gradient(145deg, var(--accent-2), var(--accent));
    display: flex; align-items: center; justify-content: center;
  }
  .mark svg { width: 76px; height: 76px; }
  .arc { stroke: var(--mark-ink); opacity: 0.8; }
  .bars rect { fill: var(--mark-ink); }
  .bars rect.dim { opacity: 0.55; }

  .word { display: flex; flex-direction: column; gap: 12px; }
  .name { font-size: 56px; line-height: 1; letter-spacing: -0.025em; color: var(--ink); font-weight: 700; white-space: nowrap; }
  .name em { font-style: normal; font-weight: 500; color: var(--accent); }
  .tag {
    font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    font-size: 15px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted); white-space: nowrap;
  }

  /* Compact (?compact) for the app window's header: at that height the tagline would be
     unreadable, so only the mark and the name remain, with tighter margins. */
  body.compact .tag { display: none; }
  body.compact .logo { padding: 12px 14px; gap: 26px; }

  /* Icon (?icon) for the app icon: no tile, the glyph in the accent color on transparent,
     grown to fill the box the tile leaves free — at 16 px a small glyph in an empty square
     would be unreadable. */
  body.icon .word { display: none; }
  body.icon .mark { background: none; }
  body.icon .mark svg { width: 104px; height: 104px; }
  body.icon .arc { stroke: var(--accent-2); opacity: 1; }
  body.icon .bars rect { fill: var(--accent); }
  body.icon .bars rect.dim { fill: var(--accent-2); opacity: 1; }
</style>
<div class="logo">
  <div class="mark">
    <svg viewBox="0 0 176 176" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g class="arc" stroke-width="12">
        <path d="M 150 88 A 62 62 0 1 1 131.8 44.2"/>
        <path d="M 134 22 L 133 46 L 109 45"/>
      </g>
      <g class="bars">
        <rect x="50" y="104" width="16" height="24" rx="5"/>
        <rect x="72" y="90" width="16" height="38" rx="5"/>
        <rect x="94" y="74" width="16" height="54" rx="5"/>
        <rect class="dim" x="116" y="58" width="16" height="70" rx="5"/>
      </g>
    </svg>
  </div>
  <div class="word">
    <div class="name">Fibocom FM350-GL <em>Windows GUI</em></div>
    <div class="tag">the link stays up</div>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search)
  if (params.get('theme') === 'dark') document.body.classList.add('dark')
  if (params.has('compact')) document.body.classList.add('compact')
  if (params.has('icon')) document.body.classList.add('icon')
</script>
